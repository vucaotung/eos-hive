name: ci
on: [push, pull_request]
jobs:
  # Pipeline hồ sơ (Python): chạy trên Linux thật vì Z2 là Windows. LibreOffice để kiểm đường .doc/.xls → A_soffice.
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-calc
      - run: pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s pipeline/test -v
        env: { PYTHONUTF8: "1" }
      - run: python3 -I runner/test/test_runner.py

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EOS_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/eos_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # check_migrations_v06.sh lấy merge-base với origin/main
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: scripts/check_secrets.sh
      - run: scripts/test_db.sh
      - run: scripts/check_migration_30.sh
      - run: scripts/check_migrations_v06.sh
      - run: scripts/test_mcp.sh
      - run: scripts/test_web.sh
      - run: scripts/test_runner.sh
      - run: python3 -I scripts/check_skills.py
      # Bản dựng giao diện (web/public) được commit: phải khớp mã nguồn web/ui
      - name: Giao diện dựng khớp bản commit
        run: |
          cd web/ui && npm ci --ignore-scripts --no-audit --no-fund && npm run build
          cd ../.. && test -z "$(git status --porcelain web/public)" || { git status --short web/public; echo 'web/public lệch mã nguồn: chạy make ui rồi commit' >&2; exit 1; }
      # Cầu nối cần binary PostgREST; tải bản cố định để lần chạy lặp lại được
      - name: PostgREST
        run: |
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ
          sudo mv postgrest /usr/local/bin/ && pip install requests
      - run: scripts/test_bridge.sh
